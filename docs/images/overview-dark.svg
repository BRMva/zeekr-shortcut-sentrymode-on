<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-label="A Worker in your Cloudflare environment keeps the second Zeekr account encrypted and talks to Zeekr's servers over an encrypted connection; the servers pass the sentry command to your car." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
</defs>
<g transform="translate(0,-28)">
<rect x="16" y="44" width="452" height="288" rx="18" fill="#151b23" stroke="#f38020" stroke-width="2"/>
<text x="40" y="78" font-size="17" font-weight="700" fill="#f8a35b">Cloudflare environment</text>
<rect x="40" y="96" width="404" height="92" rx="12" fill="#2a1c10" stroke="#f38020" stroke-width="1.5"/>
<text x="62" y="134" font-size="17" fill="#e6edf3">Worker: <tspan font-weight="700">zeekr-shortcut-sentrymode-on</tspan></text>
<text x="62" y="160" font-size="13.5" fill="#9198a1">this program · wakes up every 5 minutes</text>
<circle cx="418" cy="142" r="15" fill="none" stroke="#9198a1" stroke-width="2"/><path d="M418,133 V142 L425,146" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round"/>
<rect x="40" y="232" width="404" height="80" rx="12" fill="#10291a" stroke="#3fb950" stroke-width="1.5"/>
<path d="M63.0,259 v-3.5 a4.0,4.0 0 0 1 8.0,0 v3.5" fill="none" stroke="#3fb950" stroke-width="1.8"/><rect x="60" y="259" width="14.0" height="11.0" rx="2.0" fill="#3fb950"/>
<text x="84" y="270" font-size="14.5" font-weight="700" fill="#e6edf3">Encrypted settings</text>
<text x="60" y="296" font-size="13.5" fill="#9198a1">Second Zeekr account / shared account</text>
<line x1="242" y1="230" x2="242" y2="193" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-line)"/>
<text x="252" y="216" font-size="12.5" fill="#9198a1">read at each run</text>
<line x1="447" y1="142" x2="636" y2="142" stroke="#3fb950" stroke-width="3" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
<path d="M481.55,115 v-2.975 a3.4,3.4 0 0 1 6.8,0 v2.975" fill="none" stroke="#3fb950" stroke-width="1.53"/><rect x="479" y="115" width="11.9" height="9.35" rx="1.7" fill="#3fb950"/>
<text x="498" y="124" font-size="13" font-weight="700" fill="#3fb950">HTTPS · encrypted</text>
<text x="541" y="166" font-size="12.5" text-anchor="middle" fill="#9198a1">sign in, read the car,</text>
<text x="541" y="183" font-size="12.5" text-anchor="middle" fill="#9198a1">turn sentry on</text>
<g transform="translate(40,0)">
<rect x="600" y="96" width="176" height="92" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<rect x="620" y="114" width="22" height="7" rx="2" fill="none" stroke="#9198a1" stroke-width="1.6"/>
<rect x="620" y="123" width="22" height="7" rx="2" fill="none" stroke="#9198a1" stroke-width="1.6"/>
<rect x="620" y="132" width="22" height="7" rx="2" fill="none" stroke="#9198a1" stroke-width="1.6"/>
<text x="652" y="131" font-size="15" font-weight="700" fill="#e6edf3">Zeekr servers</text>
<text x="620" y="160" font-size="12.5" fill="#9198a1">the same ones</text>
<text x="620" y="176" font-size="12.5" fill="#9198a1">the Zeekr app uses</text>
<line x1="779" y1="128" x2="838" y2="128" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-line)"/>
<text x="808" y="119" font-size="12" text-anchor="middle" fill="#9198a1">sentry on</text>
<line x1="838" y1="158" x2="779" y2="158" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-line)"/>
<text x="808" y="176" font-size="12" text-anchor="middle" fill="#9198a1">status</text>
<rect x="842" y="96" width="142" height="92" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<path d="M886,140 L894,126 Q897,121 903,121 L925,121 Q931,121 935,126 L944,137 L950,139 Q954,140 954,145 L954,150 L882,150 L882,145 Q882,141 886,140 Z" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linejoin="round"/>
<circle cx="897" cy="151" r="6" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
<circle cx="940" cy="151" r="6" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
<text x="913" y="178" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">Your car</text>
<rect x="600" y="248" width="176" height="84" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<rect x="620" y="268" width="16" height="27" rx="3" fill="none" stroke="#9198a1" stroke-width="1.8"/>
<text x="646" y="282" font-size="15" font-weight="700" fill="#e6edf3">Zeekr app</text>
<text x="646" y="303" font-size="12.5" fill="#9198a1">your main account</text>
<line x1="688" y1="246" x2="688" y2="193" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-line)"/>
<text x="698" y="214" font-size="12.5" fill="#9198a1">shares the car with the</text>
<text x="698" y="231" font-size="12.5" fill="#9198a1">second account, once</text>
</g></g>
</svg>
