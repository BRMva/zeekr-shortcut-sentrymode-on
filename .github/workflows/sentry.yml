name: sentry

# Maintainer's test tool: one tick on GitHub Actions, started by hand (Actions tab → sentry →
# Run workflow, or `npm run gh:run` / `npm run gh:live`). The car is looked after by the
# Cloudflare Worker; this workflow has no schedule and does nothing in copies of the repo.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be done, never send the command
        type: boolean
        default: true

concurrency:
  group: zeekr-sentry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    # The ZEEKR_EMAIL variable is the on switch. A run here logs in to the same account as the
    # Cloudflare Worker and signs it out (it logs in again on a later tick), so test sparingly.
    if: vars.ZEEKR_EMAIL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Login session and parking state, encrypted with the account password (scripts/file-store.mjs).
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: .state.enc
          key: zeekr-state-${{ github.run_id }}
          restore-keys: zeekr-state-

      - name: Remember state fingerprint
        run: sha256sum .state.enc > "$RUNNER_TEMP/state.sha" 2>/dev/null || true

      - name: Tick
        run: node scripts/run.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        # Settings → Secrets and variables → Actions: ZEEKR_EMAIL and GEOFENCES are variables
        # (readable and editable), ZEEKR_PASSWORD is a secret. GEOFENCES may be a secret too.
        env:
          ZEEKR_EMAIL: ${{ vars.ZEEKR_EMAIL }}
          ZEEKR_PASSWORD: ${{ secrets.ZEEKR_PASSWORD }}
          GEOFENCES: ${{ vars.GEOFENCES || secrets.GEOFENCES }}

      # Saved even when the tick failed, so a failed login still holds back the next one.
      - name: Check whether state changed
        id: state
        if: always()
        run: |
          if [ -f .state.enc ] && ! sha256sum --check --status "$RUNNER_TEMP/state.sha" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save state
        if: always() && steps.state.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state.enc
          key: zeekr-state-${{ github.run_id }}-${{ github.run_attempt }}
